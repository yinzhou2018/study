<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>greet modal layout check</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">
  <section id="callPage" class="call-page" aria-labelledby="callPageTitle">
    <div class="call-controls">
      <button id="recordBtn" class="call-control-btn mic-on" type="button" aria-label="关闭麦克风" title="关闭麦克风">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a4 4 0 0 0 4-4V6a4 4 0 0 0-8 0v5a4 4 0 0 0 4 4Z"/><path d="M19 11a7 7 0 0 1-14 0"/><path d="M12 18v4"/><path d="M8 22h8"/><path d="M4 20 20 4"/></svg>
      </button>
      <button id="forceCommitBtn" class="call-control-btn commit" type="button" aria-label="强制判停" title="强制判停">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v7l4 2"/><path d="M5.6 5.6a9 9 0 1 1-1.7 10.1"/><path d="M3 5v5h5"/></svg>
      </button>
      <button id="greetBtn" class="call-control-btn greet" type="button" aria-label="打招呼" title="打招呼">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-8.5 8.3 8.9 8.9 0 0 1-3.7-.8L3 21l1.9-5a7.8 7.8 0 0 1-.9-3.6 8.4 8.4 0 0 1 8.5-8.3 8.4 8.4 0 0 1 8.5 8.3Z"/><path d="M8.5 10.5h.01"/><path d="M12.5 10.5h.01"/><path d="M16.5 10.5h.01"/></svg>
      </button>
      <button id="callCloseBtn" class="call-control-btn hangup" type="button" aria-label="关闭通话" title="关闭通话">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v10"/><path d="M18.4 6.6a9 9 0 1 1-12.8 0"/></svg>
      </button>
    </div>
  </section>
</div>
<div id="greetModal" class="ctx-modal" role="dialog" aria-modal="true" aria-labelledby="greetModalTitle">
  <div class="ctx-dialog greet-dialog">
    <div class="ctx-dialog-head">
      <h3 id="greetModalTitle">打招呼</h3>
      <div class="ctx-dialog-actions">
        <button id="greetCloseBtn" type="button" class="ctx-close" aria-label="关闭">×</button>
      </div>
    </div>
    <div class="ctx-summary">
      <span>让模型用当前音色主动播报一段固定文本（speech_text_buffer.commit）</span>
    </div>
    <div class="ctx-add">
      <textarea id="greetInput" rows="3" spellcheck="false">你好，我是豆包，有什么可以帮你的吗？</textarea>
      <div class="ctx-add-foot">
        <span id="greetNote" class="ctx-add-note">发送后由 TTS 链路合成并播报</span>
        <button id="greetSendBtn" type="button" class="ctx-add-btn">发送</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
